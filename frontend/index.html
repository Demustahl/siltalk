<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messenger MVP</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="authView" class="auth-view">
        <form id="authForm" class="auth-panel">
          <div>
            <p class="eyebrow">Messenger MVP</p>
            <h1>Вход в чат</h1>
          </div>

          <label>
            Backend URL
            <input id="apiUrlInput" name="apiUrl" type="url" autocomplete="url" />
          </label>

          <label>
            Username
            <input
              id="usernameInput"
              name="username"
              type="text"
              autocomplete="username"
              minlength="3"
              maxlength="64"
              required
            />
          </label>

          <label>
            Пароль
            <input
              id="passwordInput"
              name="password"
              type="password"
              autocomplete="current-password"
              minlength="8"
              maxlength="128"
              required
            />
          </label>

          <label>
            Отображаемое имя
            <input
              id="displayNameInput"
              name="displayName"
              type="text"
              maxlength="120"
            />
          </label>

          <div class="auth-actions">
            <button type="submit" data-auth-action="login">Войти</button>
            <button type="submit" data-auth-action="register" class="secondary">
              Зарегистрироваться
            </button>
          </div>

          <p id="authStatus" class="status-line"></p>
        </form>
      </section>

      <section id="chatView" class="chat-view" hidden>
        <aside class="sidebar">
          <div class="sidebar-header">
            <div>
              <p class="eyebrow">Пользователь</p>
              <h2 id="currentUserName">-</h2>
            </div>
            <button id="logoutButton" class="icon-button" type="button" title="Выйти">
              x
            </button>
          </div>

          <form id="newChatForm" class="new-chat-form">
            <label>
              Получатель
              <input
                id="receiverInput"
                type="text"
                placeholder="username"
                minlength="3"
                maxlength="64"
              />
            </label>
            <button type="submit">Открыть</button>
          </form>

          <div class="section-title">
            <span>Диалоги</span>
            <button id="refreshDialogsButton" type="button" class="text-button">
              Обновить
            </button>
          </div>
          <div id="dialogsList" class="dialogs-list"></div>
        </aside>

        <section class="conversation">
          <header class="conversation-header">
            <div>
              <p class="eyebrow">Диалог</p>
              <h2 id="chatTitle">Выбери диалог или введи username</h2>
            </div>
            <span id="socketStatus" class="connection-badge">offline</span>
          </header>

          <div id="messagesList" class="messages-list"></div>

          <form id="messageForm" class="message-form">
            <input
              id="messageInput"
              type="text"
              placeholder="Сообщение"
              autocomplete="off"
            />
            <button type="submit">Отправить</button>
          </form>

          <p id="chatStatus" class="status-line"></p>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
