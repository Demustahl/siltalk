[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "messenger-backend"
version = "0.1.0"
description = "Backend API for E2EE messenger"
requires-python = ">=3.13"
dependencies = [
  "alembic",
  "fastapi",
  "psycopg[binary]",
  "pyjwt",
  "sqlalchemy",
  "uvicorn[standard]",
]

[dependency-groups]
dev = [
  "httpx",
  "mypy",
  "pytest",
  "ruff",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s"

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.13"
